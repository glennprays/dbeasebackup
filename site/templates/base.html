<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
<link rel="canonical" href="{{.Canonical}}">
{{- if .NoIndex}}
<meta name="robots" content="noindex">
{{- end}}
<meta name="theme-color" content="#fbfaf7">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DBEaseBackup">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{.Canonical}}">
<meta property="og:image" content="{{.Site.URL}}/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="DBEaseBackup: Database backups on a schedule, checked and shipped off the box.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="{{asset "img/logo-192.png"}}">
<link rel="apple-touch-icon" href="{{asset "img/apple-touch-icon.png"}}">
<link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset "css/site.css"}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "site-header" .}}
{{template "content" .}}
{{template "site-footer" .}}
<script src="{{asset "js/copy.js"}}" defer></script>
{{block "scripts" .}}{{end}}
</body>
</html>
