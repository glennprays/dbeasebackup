name: Golangci-lint on Develop Push

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:

      - develop
    workflow_dispatch:


jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

        with:
          version: v2.15.0
