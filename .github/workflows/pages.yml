name: Deploy Site to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'targets.example.yaml'
      - 'config/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'targets.example.yaml'
      - 'config/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Redeploy after a release so the header badge shows the new tag. The push
  # build above races tag creation and would still see the previous tag.
  workflow_run:
    workflows: ['Release (Create Tag)']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so the version badge resolves to a release tag.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: site/go.mod
          cache-dependency-path: site/go.sum

      - name: Test generator
        run: go test ./...

      - name: Build site
        run: go run ./cmd/docs-gen build ../_site

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
