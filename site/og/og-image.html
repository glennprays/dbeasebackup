<!doctype html>
<!--
  Source for assets/img/og-image.png (1200x630). Regenerate with:
    make site-og
  Uses the same tokens and fonts as the site; no network requests.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 300; src: url("../assets/fonts/ibm-plex-sans-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("../assets/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("../assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 64px 72px;
    background: var(--surface-canvas); color: var(--color-ink);
    font-family: var(--font-sans); font-feature-settings: "tnum" 1;
    display: grid; grid-template-rows: auto 1fr auto; gap: 40px;
    -webkit-font-smoothing: antialiased;
  }
  .top { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
  .top img { width: 40px; height: 40px; }
  .top .label { margin-left: auto; font-family: var(--font-mono); font-size: 16px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); }
  h1 { margin: 0; align-self: end; max-width: 900px; font-size: 64px; font-weight: 300; line-height: 1.05; letter-spacing: -0.025em; }
  .ledger { border-top: 1px solid var(--color-rule-strong); font-family: var(--font-mono); font-size: 19px; }
  .row { display: grid; grid-template-columns: 200px 170px 1fr 120px; gap: 24px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--color-rule); }
  .tag { justify-self: start; padding: 3px 10px; border-radius: 2px; font-size: 15px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  .ok { background: var(--color-ok-wash); color: var(--color-ok); }
  .fail { background: var(--color-fail-wash); color: var(--color-fail); }
  .muted { color: var(--color-muted); }
  .accent { position: absolute; left: 0; top: 0; width: 8px; height: 630px; background: var(--color-accent); }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="top"><img src="../assets/img/logo-192.png" alt=""> DBEaseBackup <span class="label">dbease.glennprays.com</span></div>
  <h1>Database backups on a schedule, checked and shipped off the box.</h1>
  <div class="ledger">
    <div class="row"><span>app-db</span><span class="muted">dump</span><span>app-db_dump_20261122T020000Z.dump</span><span class="tag ok">ok</span></div>
    <div class="row"><span>prod-cluster</span><span class="muted">basebackup</span><span class="muted">pg_verifybackup failed · not uploaded</span><span class="tag fail">failed</span></div>
  </div>
</body>
</html>
