services:
  db-auto-backup:
    image: glennprays/dbeasebackup:latest
    container_name: dbeasebackup-container
    environment:
      # Storage Type
      - STORAGE_TYPE=s3
      # S3 Configuration
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      # Optional: Custom endpoint for S3-compatible storage
      # S3_ENDPOINT=${S3_ENDPOINT:-}
      # Database Configuration
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE}
      # Backup Schedule
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - BACKUP_TIMEOUT=${BACKUP_TIMEOUT:-30m}
      # Optional: Timezone
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE:-UTC}
      # Health Check Port
      - HTTP_PORT=${HTTP_PORT:-8080}
    ports:
      # Map health check port for external access
      - "${HTTP_PORT:-8080}:8080"
    network_mode: host
